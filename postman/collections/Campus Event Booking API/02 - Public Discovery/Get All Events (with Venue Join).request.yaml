$kind: http-request
url: "{{baseUrl}}/api/events"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test('Events array returned with joined venue fields', function () {
          pm.expect(res).to.be.an('array');
          pm.expect(res.length).to.be.above(0);
          pm.expect(res[0]).to.have.property('venue_name');
          pm.expect(res[0]).to.have.property('venue_location');
      });
    language: text/javascript
order: 2000
