$kind: http-request
url: "{{baseUrl}}/api/venues"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test('Venues array returned with required fields', function () {
          pm.expect(res).to.be.an('array');
          pm.expect(res.length).to.be.above(0);
          pm.expect(res[0]).to.have.property('name');
          pm.expect(res[0]).to.have.property('capacity');
      });
    language: text/javascript
order: 1000
