$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{studentToken}}
body:
  type: text
  content: |-
    {
        "event_id": {{eventId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 4000
