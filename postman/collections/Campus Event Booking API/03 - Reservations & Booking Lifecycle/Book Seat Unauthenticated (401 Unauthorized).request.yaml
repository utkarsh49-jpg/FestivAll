$kind: http-request
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "event_id": {{eventId}},
        "seat_id": {{seatId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
